<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" style="background:#0f111a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#3b82f6" />
      <stop offset="100%" stopColor="#1d4ed8" />
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#10b981" />
      <stop offset="100%" stopColor="#047857" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="147" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">Working of the TCP protocol</text>
  <text x="500" y="180" font-size="14" fill="#94a3b8" text-anchor="middle">Three-Way Handshake Connection Establishment</text>

  <!-- Client Box -->
  <rect x="276" y="260" width="144" height="75" rx="12" fill="url(#clientGrad)" stroke="#60a5fa" stroke-width="2" />
  <text x="348" y="304" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Client</text>

  <!-- Server Box -->
  <rect x="579" y="260" width="144" height="75" rx="12" fill="url(#serverGrad)" stroke="#34d399" stroke-width="2" />
  <text x="651" y="304" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Server</text>

  <!-- Active Open Tag -->
  <rect x="182" y="388" width="135" height="130" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="249" y="445" font-size="15" font-weight="bold" fill="#38bdf8" text-anchor="middle">Active</text>
  <text x="249" y="470" font-size="15" font-weight="bold" fill="#38bdf8" text-anchor="middle">Open</text>

  <!-- Passive Open Tag -->
  <rect x="682" y="388" width="135" height="130" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="749" y="445" font-size="15" font-weight="bold" fill="#4ade80" text-anchor="middle">Passive</text>
  <text x="749" y="470" font-size="15" font-weight="bold" fill="#4ade80" text-anchor="middle">Open</text>

  <!-- Vertical Timelines -->
  <line x1="348" y1="335" x2="348" y2="730" stroke="#475569" stroke-width="4" stroke-dasharray="6 6" />
  <line x1="651" y1="335" x2="651" y2="730" stroke="#475569" stroke-width="4" stroke-dasharray="6 6" />

  <!-- Step 1: SYN Arrow -->
  <line x1="348" y1="372" x2="643" y2="423" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="475" y="365" width="140" height="34" rx="8" fill="#1e1e2d" stroke="#f59e0b" stroke-width="1.5" />
  <text x="545" y="387" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="middle">1. SYN Segment</text>

  <!-- Step 2: SYN + ACK Arrow -->
  <line x1="651" y1="473" x2="356" y2="517" stroke="#06b6d4" stroke-width="4" marker-end="url(#arrowCyan)" />
  <rect x="380" y="460" width="180" height="34" rx="8" fill="#1e1e2d" stroke="#06b6d4" stroke-width="1.5" />
  <text x="470" y="482" font-size="13" font-weight="bold" fill="#22d3ee" text-anchor="middle">2. SYN + ACK Segment</text>

  <!-- Step 3: ACK Arrow -->
  <line x1="348" y1="585" x2="643" y2="633" stroke="#a855f7" stroke-width="4" marker-end="url(#arrowPurple)" />
  <rect x="475" y="575" width="140" height="34" rx="8" fill="#1e1e2d" stroke="#a855f7" stroke-width="1.5" />
  <text x="545" y="597" font-size="13" font-weight="bold" fill="#c084fc" text-anchor="middle">3. ACK Segment</text>

  <!-- Connection Established Badge -->
  <rect x="420" y="680" width="160" height="40" rx="10" fill="#065f46" stroke="#34d399" stroke-width="1.5" />
  <text x="500" y="705" font-size="13" font-weight="bold" fill="#6ee7b7" text-anchor="middle">ESTABLISHED</text>

  <!-- Footer Branding -->
  <text x="500" y="860" font-size="13" fill="#64748b" text-anchor="middle">SCALER Topics • TCP Three-Way Handshake Protocol</text>
</svg>
